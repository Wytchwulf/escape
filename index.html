<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Storage</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        background: #050505;
        color: #d8d8d8;

        font-family: "Courier New", Courier, monospace;
    }

    .terminal {
        width: min(90%, 650px);
        padding: 35px;

        border: 1px solid #444;
        background: #090909;

        box-shadow:
            0 0 30px rgba(255,255,255,0.04),
            inset 0 0 30px rgba(255,255,255,0.02);
    }

    .header {
        color: #888;
        font-size: 0.8rem;
        letter-spacing: 3px;
        margin-bottom: 35px;
    }

    h1 {
        color: #fff;
        font-size: 1.7rem;
        letter-spacing: 4px;
        margin: 0 0 30px;
    }

    .status {
        color: #ff5c5c;
        margin-bottom: 35px;
    }

    .message {
        line-height: 1.9;
        margin-bottom: 35px;
    }

    .cursor {
        animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
        50% {
            opacity: 0;
        }
    }

    .unlock {
        display: inline-block;

        padding: 14px 20px;

        border: 1px solid #aaa;
        color: #fff;
        background: transparent;

        font-family: inherit;
        font-size: 0.9rem;
        letter-spacing: 2px;
        text-decoration: none;

        transition: 0.2s;
    }

    .unlock:hover {
        background: #fff;
        color: #000;
        cursor: pointer;
    }

    .footer {
        margin-top: 35px;
        color: #555;
        font-size: 0.7rem;
    }
</style>
</head>

<body>

<div class="terminal">

    <div class="header">
        SECURE STORAGE // PRIVATE ACCESS
    </div>

    <h1>VAULT LOCKED</h1>

    <div class="status">
        [ AUTHENTICATION REQUIRED ]
    </div>

    <div class="message">
        Four locations.<br>
        Four fragments.<br>
        One key.<br><br>

        If you've made it this far,<br>
        you already have the password.<br><br>

        Your final challenge awaits.<span class="cursor">_</span>
    </div>

    <a
        class="unlock"
        href="https://google.com"
        rel="noopener noreferrer">
        [ UNLOCK FINAL VAULT ]
    </a>

    <div class="footer">
        CONNECTION SECURE // AWAITING AUTHORIZATION
    </div>

</div>

</body>
</html>
